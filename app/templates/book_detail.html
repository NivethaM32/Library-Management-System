{%extends 'base.html'%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% block content %}
    <center>
    <h2>BOOK DETAILS</h2>

    
    <table border="1">

    <tr>
        <th>Title</th>
        <td>{{ book.title }}</td>
    </tr>

    <tr>
        <th>Author</th>
        <td>{{ book.author }}</td>
    </tr>

    <tr>
        <th>Category</th>
        <td>{{ book.category }}</td>
    </tr>

    <tr>
        <th>Published Date</th>
        <td>{{ book.published_date }}</td>
    </tr>

    <tr>
        <th>ISBN</th>
        <td>{{ book.isbn }}</td>
    </tr>

    <tr>
        <th>Available Copies</th>
        <td>{{ book.available_copies }}</td>
    </tr>

    </table>

    <br>

    <a href="{% url 'book_list' %}">Back to Book List</a>

    {% endblock %}

    </center>
</body>
</html>
