{% extends 'base.html'%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% block content %}
    <center>
    <h2>BOOK LIST </h2> 
    
    <table>
    <tr>
    <th>Title</th>
    <th>Author</th>
    <th>Action</th>
    </tr>

    {% for i in books %}
    <tr>
        <td>{{i.title}}</td>
        <td>{{i.author}}</td>
        <td>
            <form action="{% url 'book_details'%}" method='POST'>
                {% csrf_token%}
                <input type="hidden" name="book_id" value="{{ i.id }}">
                <input type="submit" value="View">

            </form>
        </td>
    </tr>
    {% endfor %}
    </table><br><br>

    <a href="{% url 'book_form' %}"><button>Add book</button></a>
    
    </center>
    {% endblock %}
</body>
</html>
